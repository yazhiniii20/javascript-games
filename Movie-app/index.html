<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
      body{
        font-family: 'Times New Roman', Times, serif;
        background-color:blueviolet;
        color: white;
        text-align: center;
      }
    </style>
</head>
<body>
    <h1>Movie Search Website</h1>
    <input type ="text" id="movie-name" placeholder="Enter movie name">
    <button id="search-btn">Search</button>
    <div id="results"></div>
<script>
    const moviename = document.getElementById("movie-name");
    const search = document.getElementById("search-btn");
    const results = document.getElementById("results");
    search.addEventListener('click',()=>{
        fetchmovies(moviename.value);
    })
    async function fetchmovies(moviename){
        const response = await fetch(`https://www.omdbapi.com/?apikey=a46aa13b&s=${moviename}`);
        const data = await response.json();
        console.log(data);
        displaymovies(data);
    }
    function displaymovies(data){
        results.innerHTML = "";
        if(data.Response === "False"){
          results.innerHTML = "<h2>Movie not found</h2>";
          return;
        }
        data.Search.forEach(movie => {
            const moviediv = document.createElement("div");
            moviediv.innerHTML = `
            <h2> ${movie.Title} </h2>
            <img src="${movie.Poster}" alt="${movie.Title}" width="200">`
            results.appendChild(moviediv);
        });
    }
</script>
</body>
</html>
